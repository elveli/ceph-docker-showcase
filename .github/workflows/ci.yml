name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --version && shellcheck -x scripts/*.sh docker/ceph/entrypoint.sh
      - name: docker compose config (all profiles)
        run: |
          docker compose config -q
          docker compose --profile '*' config -q

  smoke:
    # Full end-to-end run: bootstrap a real cluster and run every demo.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Runner images ship with ~2-3 GiB free; ceph-mon won't start below 5%.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /
      - name: Load nbd (rbd-nbd needs it; containers cannot load modules)
        run: sudo modprobe nbd nbds_max=16 && ls /dev/nbd0
      - name: make up
        run: make up
      - name: make demo
        run: make demo
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --profile '*' ps -a
          docker compose exec -T mon-a ceph -s || true
          docker compose exec -T mon-a ceph health detail || true
          docker compose --profile '*' logs --tail=200
      - name: make clean
        if: always()
        run: make clean

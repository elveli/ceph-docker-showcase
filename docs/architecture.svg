<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ceph-docker-showcase architecture</title>
  <desc>A multi-daemon Ceph cluster running as Docker Compose services inside the Docker Desktop LinuxKit VM on macOS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s  { font-size: 11.5px; fill: #334155; }
      .xs { font-size: 10.5px; fill: #475569; }
      .h  { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #475569; text-transform: uppercase; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #334155; }
      .link { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .port { stroke: #2563eb; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="860" rx="14" fill="#ffffff"/>
  <text x="32" y="40" class="title">ceph-docker-showcase</text>
  <text x="32" y="60" class="s">Real Ceph daemons (quay.io/ceph/ceph v20.2.5 "Tentacle"), one per container, on a single laptop</text>

  <!-- macOS host -->
  <rect x="24" y="78" width="1152" height="762" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="102" class="h">macOS host · Apple Silicon or Intel</text>

  <rect x="42" y="114" width="300" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="136" class="t">Terminal</text>
  <text x="56" y="154" class="mono">make up · make demo · make shell</text>
  <text x="56" y="171" class="mono">aws/curl → localhost:17480 (rgw)</text>

  <rect x="360" y="114" width="300" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="374" y="136" class="t">Browser</text>
  <text x="374" y="154" class="mono">Ceph dashboard  https://localhost:18443</text>
  <text x="374" y="171" class="mono">Grafana         http://localhost:13000</text>

  <text x="690" y="134" class="xs">Ports are published on 127.0.0.1 only.</text>
  <text x="690" y="152" class="xs">Everything below runs inside the Docker Desktop VM;</text>
  <text x="690" y="170" class="xs">data lives in named volumes, never in the repo.</text>

  <!-- Docker Desktop VM -->
  <rect x="42" y="204" width="1116" height="618" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="228" class="h">Docker Desktop · LinuxKit VM</text>
  <text x="60" y="817" class="xs">LinuxKit kernel: nbd ✓  fuse ✓  loop ✓  ·  rbd ✗  ceph (kernel CephFS) ✗  → clients use rbd-nbd and ceph-fuse</text>

  <!-- compose network -->
  <rect x="60" y="242" width="800" height="562" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="76" y="264" class="h">compose network "ceph" · 10.250.0.0/24</text>

  <!-- control plane -->
  <text x="80" y="292" class="xs" font-weight="700">CONTROL PLANE</text>
  <g>
    <rect x="80" y="300" width="130" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="94" y="324" class="t">mon-a</text>
    <text x="94" y="342" class="mono">10.250.0.11</text>
    <text x="94" y="357" class="xs">cluster maps</text>
    <rect x="222" y="300" width="130" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="236" y="324" class="t">mon-b</text>
    <text x="236" y="342" class="mono">10.250.0.12</text>
    <text x="236" y="357" class="xs">Paxos quorum</text>
    <rect x="364" y="300" width="130" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="378" y="324" class="t">mon-c</text>
    <text x="378" y="342" class="mono">10.250.0.13</text>
    <text x="378" y="357" class="xs">2 of 3 = quorum</text>
    <rect x="530" y="300" width="310" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="544" y="324" class="t">mgr</text>
    <text x="544" y="342" class="mono">dashboard :8443 · prometheus :9283</text>
    <text x="544" y="357" class="xs">PG autoscaler, volumes, balancer modules</text>
  </g>

  <!-- data plane -->
  <text x="80" y="398" class="xs" font-weight="700">DATA PLANE · RADOS (size=3, min_size=2, failure domain = osd)</text>
  <g>
    <rect x="80" y="406" width="240" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="94" y="430" class="t">osd-0</text>
    <text x="94" y="447" class="xs">BlueStore, osd_memory_target 896 MiB</text>
    <path d="M110,466 v30 a60,8 0 0 0 120,0 v-30" fill="#bbf7d0" stroke="#16a34a"/>
    <ellipse cx="170" cy="466" rx="60" ry="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="170" y="492" class="mono" text-anchor="middle">block (5 GiB sparse file)</text>

    <rect x="340" y="406" width="240" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="354" y="430" class="t">osd-1</text>
    <text x="354" y="447" class="xs">BlueStore, osd_memory_target 896 MiB</text>
    <path d="M370,466 v30 a60,8 0 0 0 120,0 v-30" fill="#bbf7d0" stroke="#16a34a"/>
    <ellipse cx="430" cy="466" rx="60" ry="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="430" y="492" class="mono" text-anchor="middle">block (5 GiB sparse file)</text>

    <rect x="600" y="406" width="240" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="614" y="430" class="t">osd-2</text>
    <text x="614" y="447" class="xs">BlueStore, osd_memory_target 896 MiB</text>
    <path d="M630,466 v30 a60,8 0 0 0 120,0 v-30" fill="#bbf7d0" stroke="#16a34a"/>
    <ellipse cx="690" cy="466" rx="60" ry="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="690" y="492" class="mono" text-anchor="middle">block (5 GiB sparse file)</text>
  </g>

  <!-- gateways -->
  <text x="80" y="548" class="xs" font-weight="700">GATEWAYS / SERVICES ON TOP OF RADOS</text>
  <rect x="80" y="556" width="370" height="62" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="94" y="580" class="t">rgw</text>
  <text x="130" y="580" class="s">object storage · S3 / Swift API</text>
  <text x="94" y="600" class="mono">beast :7480  →  pools default.rgw.*</text>
  <rect x="470" y="556" width="370" height="62" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="484" y="580" class="t">mds</text>
  <text x="522" y="580" class="s">CephFS metadata server (rank 0)</text>
  <text x="484" y="600" class="mono">pools cephfs.cephfs.meta / .data</text>
  <text x="80" y="652" class="xs">RBD needs no daemon: clients talk to the OSDs directly through librbd.</text>

  <!-- one-shots -->
  <text x="80" y="672" class="xs" font-weight="700">ONE-SHOT JOBS</text>
  <rect x="80" y="680" width="250" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="94" y="702" class="t">bootstrap</text>
  <text x="94" y="722" class="xs">fsid, keyrings, monmap, ceph.conf</text>
  <rect x="350" y="680" width="250" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="364" y="702" class="t">init</text>
  <text x="364" y="722" class="xs">mgr modules, TLS cert, dashboard user</text>
  <path d="M620,694 h16 v28 h-16" fill="none" stroke="#64748b"/>
  <rect x="640" y="680" width="200" height="56" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="654" y="702" class="t">ceph-etc volume</text>
  <text x="654" y="722" class="xs">mounted read-only by daemons</text>
  <text x="80" y="760" class="xs">Startup order (healthchecks via admin sockets): bootstrap → mons → mgr + OSDs → mds, rgw, init</text>
  <text x="80" y="778" class="xs">Every daemon has a mem_limit; the core stack's limits total ≈ 5.9 GiB (6 GiB Docker Desktop minimum).</text>

  <!-- clients column -->
  <rect x="880" y="242" width="260" height="342" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="896" y="264" class="h">clients · profiles</text>
  <rect x="896" y="276" width="228" height="74" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="910" y="298" class="t">s3</text>
  <text x="936" y="298" class="s">(tools)</text>
  <text x="910" y="317" class="mono">amazon/aws-cli 2.39.0</text>
  <text x="910" y="335" class="xs">stock S3 client → rgw:7480</text>
  <rect x="896" y="362" width="228" height="96" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="910" y="384" class="t">client-a</text>
  <text x="976" y="384" class="s">(clients, privileged)</text>
  <text x="910" y="403" class="mono">rbd-nbd → /dev/nbd0 → ext4</text>
  <text x="910" y="420" class="mono">ceph-fuse → /mnt/cephfs</text>
  <text x="910" y="440" class="xs">kernel rbd / CephFS clients: tested ✗</text>
  <rect x="896" y="470" width="228" height="96" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="910" y="492" class="t">client-b</text>
  <text x="976" y="492" class="s">(clients, privileged)</text>
  <text x="910" y="511" class="mono">ceph-fuse → /mnt/cephfs</text>
  <text x="910" y="528" class="xs">sees client-a's writes (shared FS)</text>

  <!-- observability column -->
  <rect x="880" y="600" width="260" height="204" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="896" y="622" class="h">observability · profile</text>
  <rect x="896" y="634" width="228" height="62" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="910" y="656" class="t">prometheus</text>
  <text x="910" y="676" class="mono">scrapes mgr:9283 · :19090</text>
  <rect x="896" y="724" width="228" height="62" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="910" y="746" class="t">grafana</text>
  <text x="910" y="766" class="mono">provisioned dashboard · :13000</text>
  <path d="M1010,724 v-24" class="link"/>

  <!-- links: mons <-> osds -->
  <path d="M287,366 v36" class="link"/>
  <path d="M685,366 v36" class="link"/>
  <!-- gateways -> osds -->
  <path d="M265,556 v-36" class="link"/>
  <path d="M655,556 v-36" class="link"/>
  <!-- clients -> cluster -->
  <path d="M896,330 C872,330 872,630 850,630 H265 V622" class="link"/>
  <path d="M896,410 L844,461" class="link"/>
  <path d="M896,518 C868,518 868,600 844,600" class="link"/>
  <!-- prometheus -> mgr -->
  <path d="M896,665 C860,665 868,345 844,340" class="link"/>

  <!-- published ports from host -->
  <path d="M520,184 C520,240 700,250 700,298" class="port"/>
  <path d="M70,184 V587 H76" class="port"/>
  <path d="M620,184 V194 H1150 V755 H1128" class="port"/>
</svg>
